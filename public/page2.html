<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BhashaVaani - Main Engine App Shell</title>
  <style>
    /* 1. Global Background Styles */
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #dbeafe, #f3e8ff, #fce7f3);
      color: #29265c;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      margin-bottom: 20px;
    }

    h1.app-title {
      font-size: 28px;
      color: #6654e8;
      margin: 10px 0 5px 0;
    }

    /* 2. Top Navigation Bar / Modules Selection */
    .module-nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 25px;
    }

    .nav-btn {
      padding: 10px 18px;
      border: 2px solid #6654e8;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.7);
      color: #6654e8;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:hover, .nav-btn.active {
      background: #6654e8;
      color: white;
      box-shadow: 0 4px 12px rgba(102, 84, 232, 0.3);
    }

    /* 3. Main Dynamic Content Container (The Frame) */
    main#app-viewport {
      width: 100%;
      max-width: 420px;
      padding: 28px 20px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 12px 35px rgba(81, 69, 205, 0.13);
      box-sizing: border-box;
      min-height: 250px;
      transition: opacity 0.2s ease;
    }

    .icon { 
      font-size: 56px; 
      margin-bottom: 10px;
    }

    /* Action buttons inside loaded features */
    .btn-action {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      border-radius: 12px;
      background: #6654e8;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header>
    <h1 class="app-title">🌐 BhashaVaani Platform</h1>
    <p style="margin: 0; font-size: 14px; opacity: 0.8;">Main Background Engine & UI Shell</p>
  </header>

  <!-- Module Selector Navigation -->
  <div class="module-nav">
    <button class="nav-btn active" onclick="loadModule('page2.html', this)">🔗 Module 2</button>
    <button class="nav-btn" onclick="loadModule('feature_voice.html', this)">🎙️ Voice Tool</button>
    <button class="nav-btn" onclick="loadModule('feature_settings.html', this)">⚙️ Settings</button>
  </div>

  <!-- Dynamic Viewport (इसके अंदर बाकी सब फाइल्स लोड होंगी) -->
  <main id="app-viewport">
    <div class="icon">🔗</div>
    <h2 style="color: #6654e8;">Loading Page...</h2>
    <p>Please wait while content is fetching...</p>
  </main>

  <script>
    // Module loader function using fetch API
    function loadModule(pageUrl, btnElement) {
      const viewport = document.getElementById('app-viewport');
      
      // Active Button Highlight Update
      if (btnElement) {
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
      }

      // Smooth Fade-out effect
      viewport.style.opacity = '0.3';

      fetch(pageUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.text();
        })
        .then(htmlContent => {
          // Replace container inner HTML with targeted file HTML
          viewport.innerHTML = htmlContent;
          viewport.style.opacity = '1';
        })
        .catch(error => {
          // Fallback UI if file is missing (404 Error handling)
          viewport.innerHTML = `
            <div class="icon">⚠️</div>
            <h2 style="color: #e53e3e;">Module Not Found</h2>
            <p style="color: #718096; font-size: 14px;">फाइल '${pageUrl}' सर्वर पर नहीं मिली।</p>
            <button class="btn-action" onclick="loadModule('page2.html', null)">Go to Default Module</button>
          `;
          viewport.style.opacity = '1';
        });
    }

    // Default Load Page 2 on startup
    window.addEventListener('DOMContentLoaded', () => {
      loadModule('page2.html', document.querySelector('.nav-btn'));
    });
  </script>
</body>
</html>
