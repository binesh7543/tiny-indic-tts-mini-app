
name: Telegram Serverless CLI Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  tgcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check project files
        run: |
          echo "Repository files:"
          ls -la
          echo "Workflow environment is ready."

      - name: Check Telegram Serverless CLI
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          npx --yes @tgcloud/cli --help

      - name: Verify CLI authentication
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "ERROR: TGCLOUD_TOKEN secret is missing."
            exit 1
          fi
          echo "TGCLOUD_TOKEN is configured."
          npx --yes @tgcloud/cli status
          
