
name: Deploy Telegram Mini App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare tgcloud project
        run: |
          npx --yes @tgcloud/cli init --no-git
          cat > tgcloud.jsonc <<'EOF'
          {
            "static": {
              "source": "public"
            }
          }
          EOF

      - name: Deploy Mini App
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "TGCLOUD_TOKEN secret is missing."
            exit 1
          fi

          npx --yes @tgcloud/cli push
          
