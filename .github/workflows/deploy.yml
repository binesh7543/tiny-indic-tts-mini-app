
name: Telegram Serverless CLI Setup Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  tgcloud-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check repository files
        run: |
          echo "Repository checkout successful."
          ls -la

      - name: Check CLI version
        run: npx --yes @tgcloud/cli --version

      - name: Check CLI commands
        run: npx --yes @tgcloud/cli --help

      - name: Verify token is configured
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "ERROR: TGCLOUD_TOKEN secret is missing."
            exit 1
          fi
          echo "TGCLOUD_TOKEN secret is available."

      - name: Check initialization options
        run: npx --yes @tgcloud/cli init --help
        
