
name: Deploy Tiny Indic TTS Mini App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Initialize fresh tgcloud project
        run: npx --yes @tgcloud/cli init --no-git

      - name: Configure Mini App
        run: |
          cat > tgcloud.jsonc <<'EOF'
          {
            "static": {
              "source": "public"
            }
          }
          EOF

      - name: Deploy and overwrite existing modules
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx --yes @tgcloud/cli push --force
